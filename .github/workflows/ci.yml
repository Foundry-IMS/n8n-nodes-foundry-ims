name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install, not npm ci: @n8n/node-cli's dep tree trips an npm dedupe
      # bug (ignore@5 vs @7 under @langchain/community) that writes a lockfile
      # npm ci refuses. The n8n linter forbids an overrides workaround.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run build
